name: Build Shadowrocket Subscription
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
  push:
    branches: [main]
    paths:
      - "tools/shadowrocket_aggregate.py"
      - ".github/workflows/shadowrocket.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/shadowrocket_aggregate.py
      - name: Commit generated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowrocket/sub.txt shadowrocket/plain.txt shadowrocket/status.json
          git diff --cached --quiet || git commit -m "chore: refresh Shadowrocket subscription"
          git push
